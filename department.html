<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Department | BIQSOLO DIGITAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header" class="sticky top-0 z-40 bg-[#08080a]/95 backdrop-blur-md border-b border-zinc-800/80"></header>

  <main id="department-page-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-16 w-full space-y-12"></main>

  <footer id="site-footer" class="bg-[#060608] border-t border-zinc-900"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const deptSlug = params.get("dept");
    const dept = DEPARTMENTS_DATA.find(d => d.slug === deptSlug) || DEPARTMENTS_DATA[0];
    document.title = `${dept.name} | BIQSOLO DIGITAL`;

    document.getElementById("department-page-content").innerHTML = `
      <div class="space-y-4 max-w-4xl">
        <a href="services.html" class="text-xs gold-text hover:underline">&larr; Back to All Six Departments</a>
        <div class="text-xs font-mono gold-text uppercase tracking-widest">Department ${dept.number}</div>
        <h1 class="text-4xl sm:text-5xl font-bold">${dept.name}</h1>
        <p class="text-zinc-300 text-lg leading-relaxed">${dept.overview}</p>
        <div class="pt-2 flex flex-wrap gap-3">
          <a href="contact.html?dept=${encodeURIComponent(dept.name)}#request" class="btn-gold px-6 py-3 rounded text-xs uppercase tracking-wider">Request ${dept.name}</a>
          <a href="contact.html" class="btn-outline-gold px-6 py-3 rounded text-xs uppercase tracking-wider">Schedule Consultation</a>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="luxury-card p-8">
          <h2 class="text-2xl font-bold gold-text mb-4">Core Services Offered</h2>
          <ul class="space-y-3 text-sm text-zinc-200">
            ${dept.services.map(s => `<li class="flex items-center space-x-2.5"><span class="gold-text">&#10022;</span><span>${s}</span></li>`).join("")}
          </ul>
        </div>
        <div class="luxury-card p-8">
          <h2 class="text-2xl font-bold gold-text mb-4">Key Deliverables</h2>
          <ul class="space-y-3 text-sm text-zinc-200">
            ${dept.deliverables.map(del => `<li class="flex items-center space-x-2.5"><span class="gold-text">&#10003;</span><span>${del}</span></li>`).join("")}
          </ul>
        </div>
      </div>
    `;

    initPageShell("services");
  </script>
</body>
</html>
