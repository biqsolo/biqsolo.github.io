<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio & Case Studies | BIQSOLO DIGITAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header" class="sticky top-0 z-40 bg-[#08080a]/95 backdrop-blur-md border-b border-zinc-800/80"></header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-16 w-full">
    <div class="max-w-3xl mb-12 space-y-3">
      <span class="text-xs uppercase tracking-[0.2em] gold-text font-semibold">Portfolio</span>
      <h1 class="text-4xl sm:text-5xl font-bold">Selected <span class="gold-text">Work & Case Studies</span></h1>
      <p class="text-zinc-400 text-sm sm:text-base">
        Explore how BIQSOLO DIGITAL approaches brand identity, software systems, digital products, and business growth.
      </p>
    </div>

    <div id="portfolio-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer id="site-footer" class="bg-[#060608] border-t border-zinc-900"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("portfolio-cards-grid").innerHTML = PORTFOLIO_PROJECTS.map(p => `
      <article class="luxury-card p-6 flex flex-col justify-between space-y-4">
        <div>
          <span class="text-[11px] uppercase tracking-wider gold-text font-semibold">${p.department}</span>
          <h2 class="text-xl font-bold mt-2 mb-3">${p.title}</h2>
          <p class="text-zinc-400 text-xs leading-relaxed mb-4">${p.summary}</p>
        </div>
        <div class="pt-3 border-t border-zinc-800/80">
          <span class="text-[11px] text-zinc-500 block uppercase tracking-wider">Outcome</span>
          <p class="text-xs text-zinc-200 mt-0.5">${p.outcome}</p>
        </div>
      </article>
    `).join("");

    initPageShell("portfolio");
  </script>
</body>
</html>
